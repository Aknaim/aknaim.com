services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aknaim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aknaim}
      POSTGRES_DB: ${POSTGRES_DB:-aknaim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aknaim} -d ${POSTGRES_DB:-aknaim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aknaim}:${POSTGRES_PASSWORD:-aknaim}@db:5432/${POSTGRES_DB:-aknaim}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
