# Local development: Postgres only. Run Next.js on the host with `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aknaim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aknaim}
      POSTGRES_DB: ${POSTGRES_DB:-aknaim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aknaim} -d ${POSTGRES_DB:-aknaim}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
